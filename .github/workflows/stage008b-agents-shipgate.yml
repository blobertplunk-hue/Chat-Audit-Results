name: stage008b-agents-shipgate

on:
  push:
    branches:
      - benchmark/stage008b-agents-shipgate-20260905

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch exact Agents Shipgate pin
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/ThreeMoonsLab/agents-shipgate.git /tmp/agents-shipgate-src
          git -C /tmp/agents-shipgate-src checkout -q c41571f2d11eb5864b487f0ace40a84dfa8f385b
          test "$(git -C /tmp/agents-shipgate-src rev-parse HEAD)" = "c41571f2d11eb5864b487f0ace40a84dfa8f385b"

      - name: Install pinned Agents Shipgate into host-protected runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /opt/agents-shipgate-stage008b
          sudo python -m venv --copies /opt/agents-shipgate-stage008b
          sudo /opt/agents-shipgate-stage008b/bin/python -m pip install --disable-pip-version-check -q --upgrade pip
          sudo /opt/agents-shipgate-stage008b/bin/python -m pip install --disable-pip-version-check -q /tmp/agents-shipgate-src
          sudo chown -R root:root /opt/agents-shipgate-stage008b
          sudo chmod -R go-w /opt/agents-shipgate-stage008b
          test ! -L /opt/agents-shipgate-stage008b/bin/python
          test ! -w /opt/agents-shipgate-stage008b/bin/python || test "$(stat -c '%U' /opt/agents-shipgate-stage008b/bin/python)" = root
          /opt/agents-shipgate-stage008b/bin/agents-shipgate --version

      - name: Execute frozen scored benchmark slice
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_HOME="$(python3 -c 'import os,pwd; print(pwd.getpwuid(os.getuid()).pw_dir)')"
          sed '/^  instructions: \[\]$/d' benchmark/stage008b/agents-shipgate/run.sh \
            | sed "s|^POLICY=.*|POLICY=\"$ACCOUNT_HOME/.config/agents-shipgate/human-authorization-trust-policy.json\"|" \
            > /tmp/run-shipgate-fixed.sh
          bash /tmp/run-shipgate-fixed.sh /tmp/agents-shipgate-src /opt/agents-shipgate-stage008b

      - name: Upload raw benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage008b-agents-shipgate-results
          path: benchmark-output/agents-shipgate
          if-no-files-found: warn
          retention-days: 30
