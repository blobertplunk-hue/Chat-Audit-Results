name: npm dependency acquisition

on:
  pull_request:
    paths:
      - 'dependency-acquisition/**'

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dependency-acquisition
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: dependency-acquisition/package.json
      - name: Install exact dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify dependency tree
        run: npm ls --depth=0
      - name: Verify package versions and imports
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const expected = {
            playwright: '1.61.1',
            'fast-xml-parser': '5.10.1',
            parse5: '8.0.1',
            'pdfjs-dist': '6.1.200',
            yauzl: '3.4.0',
            'file-type': '22.0.1',
            minisearch: '7.2.0'
          };
          for (const [name, version] of Object.entries(expected)) {
            const pkg = JSON.parse(await readFile(`node_modules/${name}/package.json`, 'utf8'));
            if (pkg.version !== version) throw new Error(`${name}: expected ${version}, got ${pkg.version}`);
          }
          await import('playwright');
          await import('fast-xml-parser');
          await import('parse5');
          await import('pdfjs-dist/legacy/build/pdf.mjs');
          await import('yauzl');
          await import('file-type');
          await import('minisearch');
          console.log('IMPORT_PROBE=PASS');
          NODE
      - name: Build deterministic dependency bundle
        run: |
          npm --version > npm-version.txt
          node --version > node-version.txt
          npm ls --depth=0 --json > npm-ls.json
          sha256sum package.json package-lock.json > manifest.sha256
          tar --sort=name --mtime='UTC 2026-08-03' --owner=0 --group=0 --numeric-owner -czf node_modules.tgz node_modules
          sha256sum node_modules.tgz >> manifest.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-resource-harvester-task1-dependencies
          path: |
            dependency-acquisition/package-lock.json
            dependency-acquisition/node_modules.tgz
            dependency-acquisition/npm-ls.json
            dependency-acquisition/npm-version.txt
            dependency-acquisition/node-version.txt
            dependency-acquisition/manifest.sha256
          if-no-files-found: error
          retention-days: 1
